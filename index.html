<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>DEEPER</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <header>
    <h1>DEEPER</h1>
    <div class="subtitle">100 levels. The further you go, the more there is to find.</div>
    <div class="depth-mark" id="depthMark"></div>
  </header>
  <main>
    <div class="card" id="card">
      <div class="level" id="levelLabel">Level 1</div>
      <div class="prompt" id="prompt">Loading...</div>
      <div id="interaction"></div>
      <div class="hint" id="hint"></div>
      <div class="feedback" id="feedback"></div>
      <div class="progress" id="progress"></div>
    </div>
  </main>
  <footer>DEEPER · Progress saved locally · Enter a code to resume</footer>
  <script src="game.js"></script>
</body>
</html>
